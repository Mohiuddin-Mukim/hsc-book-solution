plugins {
 id 'com.android.application'
}

android {
 namespace 'bd.hscsolution.student'
 compileSdk 36

 defaultConfig {
  applicationId 'bd.hscsolution.student'
  minSdk 28
  targetSdk 36
  versionCode 1
  versionName '0.1.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

  // এই লাইনটি defaultConfig ব্লকের ভেতরে থাকতে হবে
  buildConfigField 'String', 'API_BASE_URL', '"http://192.168.0.105:8080/api/v1/"'
 }

 buildFeatures {
  buildConfig true
 }

 buildTypes {
  debug {
   applicationIdSuffix '.debug'
  }
  release {
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
  }
 }

 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }

 lint {
  abortOnError true
  checkReleaseBuilds true
 }
}

dependencies {
 implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'com.google.android.material:material:1.13.0'
 implementation 'androidx.fragment:fragment:1.8.9'
 implementation 'androidx.recyclerview:recyclerview:1.4.0'
 implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
 implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
 implementation 'androidx.lifecycle:lifecycle-runtime:2.9.4'
 implementation 'androidx.navigation:navigation-fragment:2.9.4'
 implementation 'androidx.navigation:navigation-ui:2.9.4'
 implementation 'androidx.room:room-runtime:2.8.3'
 annotationProcessor 'androidx.room:room-compiler:2.8.3'
 implementation 'androidx.work:work-runtime:2.10.5'
 implementation 'com.squareup.retrofit2:retrofit:2.11.0'
 implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
 implementation 'com.github.bumptech.glide:glide:4.16.0'

 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:core:1.6.1' // ApplicationProvider এর জন্য এটি জরুরি
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}