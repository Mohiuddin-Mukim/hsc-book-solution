plugins { id 'com.android.application' }
android {
 namespace 'bd.hscsolution.student'
 compileSdk 36
 defaultConfig { applicationId 'bd.hscsolution.student'; minSdk 28; targetSdk 36; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 buildTypes { debug { applicationIdSuffix '.debug' }; release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'com.google.android.material:material:1.13.0'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
