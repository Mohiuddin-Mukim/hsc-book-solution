name: phase1-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: hsc_solution
          POSTGRES_USER: hsc
          POSTGRES_PASSWORD: hsc_local_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hsc -d hsc_solution"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U hsc -d hsc_solution; do
            echo "Waiting for database to be ready..."
            sleep 2
          done

      - name: Verify backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hsc_solution
          SPRING_DATASOURCE_USERNAME: hsc
          SPRING_DATASOURCE_PASSWORD: hsc_local_password
        run: mvn --batch-mode clean verify

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        working-directory: admin
        run: npm install --legacy-peer-deps

      - name: Check admin
        working-directory: admin
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest
          ./gradlew lintDebug
          ./gradlew assembleDebug
