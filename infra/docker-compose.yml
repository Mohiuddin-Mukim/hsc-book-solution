services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hsc_academic}
      POSTGRES_USER: ${POSTGRES_USER:-hsc_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [hsc_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hsc_dev} -d ${POSTGRES_DB:-hsc_academic}"]
      interval: 5s
      timeout: 3s
      retries: 15
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-local}
    ports: ["${MINIO_API_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [hsc_minio_data:/data]
volumes:
  hsc_postgres_data:
  hsc_minio_data:
