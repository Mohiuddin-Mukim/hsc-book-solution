spring:
  application:
    name: hsc-academic-solution-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hsc_academic}
    username: ${DB_USERNAME:hsc_local}
    password: ${DB_PASSWORD:mukim}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

#  jpa:
#    hibernate:
#      ddl-auto: create-drop
#    database-platform: org.hibernate.dialect.H2Dialect
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
hsc:
  security:
    jwt-secret: ${JWT_SECRET:change-this-local-development-secret-to-a-long-random-value-please-mohiuddinmukimmmmm}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:superadmin15@gmail.com}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:SuperAdmin@123#}
    bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:Super Admin}
    login-rate-limit: ${LOGIN_RATE_LIMIT:5}
    login-rate-window-seconds: ${LOGIN_RATE_WINDOW_SECONDS:900}
