spring:
  application:
    name: hsc-academic-solution-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hsc_academic}
    username: ${DB_USERNAME:hsc_local}
    password: ${DB_PASSWORD:mukim}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:10MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:12MB}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

hsc:
  security:
    jwt-secret: ${JWT_SECRET:change-this-local-development-secret-to-a-long-random-value-please-mohiuddinmukimmmmm}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:superadmin15@gmail.com}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:SuperAdmin@123#}
    bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:Super Admin}
    login-rate-limit: ${LOGIN_RATE_LIMIT:5}
    login-rate-window-seconds: ${LOGIN_RATE_WINDOW_SECONDS:900}

  media:
    backend: ${MEDIA_STORAGE_BACKEND:local}
    local-root: ${MEDIA_LOCAL_ROOT:./runtime/media}
    quarantine-root: ${MEDIA_QUARANTINE_ROOT:./runtime/media-quarantine}
    max-bytes: ${MEDIA_MAX_BYTES:10485760}
    max-width: ${MEDIA_MAX_WIDTH:4096}
    max-height: ${MEDIA_MAX_HEIGHT:4096}
    allowed-mime-types: ${MEDIA_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp}
    allowed-extensions: ${MEDIA_ALLOWED_EXTENSIONS:jpg,jpeg,png,webp}
    s3:
      bucket: ${MEDIA_S3_BUCKET:}
      region: ${MEDIA_S3_REGION:ap-southeast-1}
      endpoint: ${MEDIA_S3_ENDPOINT:}
      path-style-access: ${MEDIA_S3_PATH_STYLE:false}
      presign-seconds: ${MEDIA_S3_PRESIGN_SECONDS:300}


logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
